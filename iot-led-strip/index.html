<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-container">
    <header>
        <h1>My Home</h1>
        <div class="status-subtitle">Connected to <span id="current-color">{current_color}</span></div>
    </header>

    <!-- Strip Main Controls -->
    <div class="card">
        <div class="card-title">💡 Strip Master</div>
        <div class="slider-group">
            <div class="slider-header">
                <span>Brightness</span>
                <span class="slider-val" id="brightness-val">{current_brightness}</span>
            </div>
            <input type="range" min="0" max="7" value="{current_brightness}" id="brightness-slider" onchange="changeBrightness(this.value)" oninput="document.getElementById('brightness-val').innerText=this.value">
        </div>
        <div class="grid-2">
            <button class="btn btn-primary" onclick="press('33')">Next Scene</button>
            <button class="btn" onclick="press('26')">Mode</button>
        </div>
    </div>

    <!-- Quick Colors -->
    <div class="card">
        <div class="card-title">🎨 Scenes</div>
        <div class="color-grid" id="main-color-grid">
            <!-- Dynamic Circles -->
        </div>
    </div>

    <!-- WiZ Controls -->
    <div class="card">
        <div class="card-title">🌟 WiZ Bulb</div>
        <div class="wiz-controls">
            <div class="slider-group">
                <div class="slider-header"><span>Temperature</span></div>
                <input type="range" min="2700" max="6500" step="100" value="2700" id="temp-slider" onchange="wizTemp(this.value)">
            </div>
            <div class="slider-group">
                <div class="slider-header"><span>Dimming</span></div>
                <input type="range" min="10" max="100" value="100" onchange="wizDim(this.value)">
            </div>
            <div class="color-picker-wrapper">
                <input type="color" onchange="wizColor(this.value)">
            </div>
            <div style="margin-top: 10px;">
                <button class="btn" onclick="toggleComplement()" id="complement-btn">Complement: {complement_status}</button>
            </div>
        </div>
    </div>

    <!-- Troubleshoot -->
    <details>
        <summary>Settings & Sync</summary>
        <div class="sync-grid">
            <button class="sync-btn" onclick="press('25')">Inc Speed</button>
            <!-- Sync buttons will be injected -->
            {sync_buttons}
            {sync_bright_buttons}
        </div>
    </details>
    
    <div id="status-msg">System Ready</div>
</div>

<script id="colors-data" type="application/json">{colors_js}</script>
<script id="colors-rgb" type="application/json">{colors_rgb}</script>
<script id="config-status-topic" type="text/plain">{status_topic}</script>
<script src="script.js"></script>
</body>
</html>
