<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Button Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }
        h1 { color: #1c1e21; margin-bottom: 1rem; font-size: 1.5rem; }
        button {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.98); opacity: 0.8; }
        .btn-26 { background-color: #007bff; }
        .btn-25 { background-color: #28a745; }
        .btn-33 { background-color: #ffc107; color: #212529; }
        #status {
            margin-top: 1.5rem;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            background-color: #f8f9fa;
            color: #65676b;
            min-height: 20px;
        }
        .success-flash {
            background-color: #d4edda !important;
            color: #155724 !important;
            border: 1px solid #c3e6cb;
        }
        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #bbb;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .online { background-color: #42b72a; }
    </style>
</head>
<body>

<div class="container">
    <h1>ESP32 Control</h1>
    <div style="margin-bottom: 20px;">
        <span id="dot" class="status-dot"></span>
        <span id="conn-text">Connecting...</span>
    </div>
    
    <button class="btn-26" onclick="press('26')">Press Pin 26</button>
    <button class="btn-25" onclick="press('25')">Press Pin 25</button>
    <button class="btn-33" onclick="press('33')">Press Pin 33</button>
    
    <div id="status">Waiting for ESP32...</div>
</div>

<script>
    const MQTT_BROKER = "broker.hivemq.com";
    const MQTT_PORT = 8000; 
    const TOPIC_PREFIX = "/anikets32/button/";
    const STATUS_TOPIC = "/anikets32/status";
    const CLIENT_ID = "web_client_" + Math.random().toString(16).substr(2, 8);

    const client = new Paho.MQTT.Client(MQTT_BROKER, MQTT_PORT, CLIENT_ID);

    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    client.connect({
        onSuccess: onConnect,
        useSSL: false,
        keepAliveInterval: 30
    });

    function onConnect() {
        console.log("Connected to MQTT Broker");
        document.getElementById("dot").classList.add("online");
        document.getElementById("conn-text").innerText = "Online";
        client.subscribe(STATUS_TOPIC);
        document.getElementById("status").innerText = "Connected & Ready";
    }

    function onConnectionLost(responseObject) {
        document.getElementById("dot").classList.remove("online");
        document.getElementById("conn-text").innerText = "Disconnected";
        document.getElementById("status").innerText = "Connection Lost";
    }

    function onMessageArrived(message) {
        console.log("Message Arrived: " + message.payloadString);
        if (message.destinationName === STATUS_TOPIC) {
            const statusDiv = document.getElementById("status");
            if (message.payloadString.startsWith("SUCCESS")) {
                const pin = message.payloadString.split(":")[1];
                statusDiv.innerText = "✅ ESP32 Confirmed: Pin " + pin;
                statusDiv.classList.add("success-flash");
                
                setTimeout(() => {
                    statusDiv.classList.remove("success-flash");
                    statusDiv.innerText = "Ready";
                }, 3000);
            }
        }
    }

    function press(pin) {
        const message = new Paho.MQTT.Message("press");
        message.destinationName = TOPIC_PREFIX + pin;
        client.send(message);
        document.getElementById("status").innerText = "Sending command...";
    }
</script>

</body>
</html>
